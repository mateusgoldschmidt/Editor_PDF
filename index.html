<!DOCTYPE html>
<html lang="pt-BR">
<!-- Desenvolvido por Mateus Goldschmidt -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Workspace</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; overscroll-behavior-y: none; }
        .page-item { touch-action: none; transition: all 0.2s; }
        .page-item.selected { box-shadow: 0 0 0 4px #3b82f6; border-color: #3b82f6; transform: scale(0.98); }
        .page-item.sortable-ghost { opacity: 0.4; transform: scale(0.95); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Drag and Drop Global Overlay */
        #dropzone { transition: opacity 0.3s, z-index 0s; }
        #dropzone.active { opacity: 1; z-index: 100; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px); }
        
        /* Modais */
        .modal { transition: opacity 0.3s; opacity: 0; pointer-events: none; z-index: 200; }
        .modal.active { opacity: 1; pointer-events: auto; }
        
        /* Crop Overlay Box */
        .crop-preview-box { transition: clip-path 0.1s; border: 2px dashed #ef4444; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans relative">

    <!-- Global Drag Drop Zone -->
    <div id="dropzone" class="fixed inset-0 opacity-0 pointer-events-none flex flex-col items-center justify-center border-4 border-dashed border-blue-500 m-4 rounded-3xl">
        <svg class="w-24 h-24 text-blue-500 mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <h2 class="text-3xl font-bold text-white">Solte os arquivos aqui</h2>
    </div>

    <!-- Header / Barra de Ferramentas -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex flex-col gap-4 shadow-md z-10 shrink-0">
        <div class="flex flex-wrap justify-between items-center gap-4">
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <svg class="w-8 h-8 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"></path></svg>
                    <h1 class="text-xl font-bold tracking-wide">PDF<span class="text-slate-400 font-light">Workspace</span></h1>
                </div>
                <span class="text-[10px] text-slate-500 font-medium ml-10 uppercase tracking-widest">Desenvolvido por Mateus Goldschmidt</span>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-600 focus-within:border-blue-500 transition">
                <span class="text-sm text-slate-400 hidden sm:block">Arquivo Final:</span>
                <input type="text" id="fileNameInput" value="Documento_Workspace" class="flex-1 bg-transparent text-white focus:outline-none text-sm w-full sm:w-48 placeholder-slate-500">
                <span class="text-slate-400 font-medium text-sm">.pdf</span>
            </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-800/50 rounded-xl p-1">
            
            <!-- Grupo 1: Layout e Seleção -->
            <div class="flex items-center gap-2 w-full md:w-auto">
                <select id="nupMode" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-sm border border-slate-600 focus:outline-none transition cursor-pointer flex-1 md:flex-none">
                    <option value="1">Layout: Normal (1 por folha)</option>
                    <option value="2">Agrupar: 2 Páginas por Folha</option>
                    <option value="4">Agrupar: 4 Páginas por Folha</option>
                </select>

                <button id="selectionModeBtn" class="bg-slate-700 hover:bg-blue-600 text-white px-3 py-2 rounded-lg text-sm border border-slate-600 transition flex items-center gap-2 flex-1 md:flex-none justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Selecionar</span>
                </button>
            </div>
            
            <!-- Grupo 2: Ações Principais -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <button id="rotateAllBtn" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-lg shadow-sm" title="Girar Todas">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <button id="clearBtn" class="bg-slate-800 border border-slate-600 hover:bg-red-900/50 hover:text-red-400 hover:border-red-500 text-slate-300 p-2 rounded-lg shadow-sm transition" title="Limpar Tudo">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>

                <div class="h-6 w-px bg-slate-600 mx-1 hidden md:block"></div>

                <button onclick="executeAction('share')" class="bg-indigo-600 hover:bg-indigo-500 transition text-white w-10 h-10 rounded-lg flex items-center justify-center shadow-sm" title="Compartilhar">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                </button>
                
                <button onclick="executeAction('print')" class="bg-slate-600 hover:bg-slate-500 transition text-white w-10 h-10 rounded-lg flex items-center justify-center shadow-sm" title="Imprimir Direto">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                </button>

                <label class="flex-1 sm:flex-none cursor-pointer bg-slate-700 hover:bg-slate-600 transition text-white px-3 py-2 rounded-lg flex items-center justify-center gap-2 text-sm font-medium shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Adicionar
                    <input type="file" id="fileInput" multiple accept=".pdf, image/png, image/jpeg" class="hidden">
                </label>
                
                <button onclick="executeAction('download')" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 transition text-white px-6 py-2 rounded-lg flex items-center justify-center gap-2 text-sm font-bold shadow-lg shadow-blue-900/50 flex-1 sm:flex-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Baixar PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Barra de Múltipla Seleção -->
    <div id="selectionBar" class="bg-blue-600 text-white p-3 flex flex-wrap justify-between items-center shadow-md z-20 hidden transform transition-transform">
        <div class="flex items-center gap-3">
            <span id="selCountText" class="font-bold">0 selecionadas</span>
            <button onclick="clearSelection()" class="text-blue-200 hover:text-white text-sm underline">Cancelar</button>
        </div>
        <div class="flex gap-2">
            <button onclick="deleteSelected()" class="bg-red-500 hover:bg-red-400 px-3 py-1.5 rounded text-sm font-medium flex items-center gap-1">Excluir</button>
            <button onclick="executeAction('download', true)" class="bg-slate-900 hover:bg-slate-800 px-3 py-1.5 rounded text-sm font-medium flex items-center gap-1">Extrair Seleção</button>
        </div>
    </div>

    <!-- Área de Trabalho -->
    <main class="flex-1 p-6 overflow-y-auto bg-slate-900 relative">
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 pointer-events-none transition-opacity duration-300">
            <svg class="w-20 h-20 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <p class="text-lg">Adicione PDFs ou Imagens</p>
            <p class="text-sm opacity-70 mt-1">Você pode soltar arquivos em qualquer lugar da tela</p>
        </div>

        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6 pb-20 items-start">
            <!-- Miniaturas -->
        </div>
    </main>

    <!-- Footer Autoria -->
    <footer class="bg-slate-900 py-2 text-center text-slate-500 text-xs border-t border-slate-800">
        Desenvolvido por Mateus Goldschmidt
    </footer>

    <!-- Overlay Loading -->
    <div id="loading" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm hidden items-center justify-center z-[300]">
        <div class="flex flex-col items-center">
            <svg class="animate-spin h-10 w-10 text-blue-500 mb-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p id="loadingText" class="text-white font-medium">Processando...</p>
        </div>
    </div>

    <!-- Modal Zoom Tela Cheia -->
    <div id="zoomModal" class="modal fixed inset-0 bg-black/95 flex items-center justify-center p-4">
        <button onclick="closeZoom()" class="absolute top-4 right-4 text-white bg-slate-800 hover:bg-red-600 rounded-full p-2 w-10 h-10 flex items-center justify-center transition z-10">&times;</button>
        <img id="zoomImg" src="" class="max-w-full max-h-full object-contain rounded shadow-2xl">
    </div>

    <!-- Modal Crop Tool -->
    <div id="cropModal" class="modal fixed inset-0 bg-slate-900/95 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-xl shadow-2xl max-w-lg w-full flex flex-col gap-4">
            <h3 class="text-white text-lg font-bold flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"></path></svg>
                Recortar Margens (%)
            </h3>
            
            <div class="flex gap-4 items-center justify-center">
                <div class="relative w-48 h-64 bg-slate-900 rounded border border-slate-700 flex items-center justify-center overflow-hidden">
                    <img id="cropPreviewImg" src="" class="absolute inset-0 w-full h-full object-contain pointer-events-none">
                    <div id="cropBox" class="absolute inset-0 crop-preview-box"></div>
                </div>
                
                <div class="flex flex-col gap-3 flex-1">
                    <label class="text-slate-300 text-xs">Cima: <span id="valT">0</span>%<input type="range" id="cropT" min="0" max="40" value="0" class="w-full"></label>
                    <label class="text-slate-300 text-xs">Baixo: <span id="valB">0</span>%<input type="range" id="cropB" min="0" max="40" value="0" class="w-full"></label>
                    <label class="text-slate-300 text-xs">Esq: <span id="valL">0</span>%<input type="range" id="cropL" min="0" max="40" value="0" class="w-full"></label>
                    <label class="text-slate-300 text-xs">Dir: <span id="valR">0</span>%<input type="range" id="cropR" min="0" max="40" value="0" class="w-full"></label>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeCrop()" class="px-4 py-2 text-slate-300 hover:text-white">Cancelar</button>
                <button onclick="applyCrop()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow">Aplicar Recorte</button>
            </div>
        </div>
    </div>

    <!-- Iframe Oculto para Impressão -->
    <iframe id="printFrame" class="hidden"></iframe>

    <script>
        // TRUQUE PARA EVITAR O BUG DO MARKDOWN NO CHAT: A URL do script é dividida para evitar auto-link
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare' + '.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pagesData = {}; 
        let fileIdCounter = 0;
        let selectedIds = new Set();
        let currentCropId = null;

        // Referências DOM
        const grid = document.getElementById('grid');
        const emptyState = document.getElementById('emptyState');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const selectionBar = document.getElementById('selectionBar');
        const selCountText = document.getElementById('selCountText');
        const dropzone = document.getElementById('dropzone');

        // Inicializa Drag and Drop Reordenar
        new Sortable(grid, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            delay: 150, 
            delayOnTouchOnly: true
        });

        // Eventos Globais de Drag and Drop Arquivos
        window.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('active'); });
        window.addEventListener('dragleave', (e) => { 
            if(e.target === dropzone || e.relatedTarget === null) dropzone.classList.remove('active'); 
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('active');
            if (e.dataTransfer.files.length) handleFiles({ target: { files: e.dataTransfer.files } });
        });

        // Lógica de Seleção Mode
        let selectionModeActive = false;
        document.getElementById('selectionModeBtn').addEventListener('click', () => {
            selectionModeActive = !selectionModeActive;
            const btn = document.getElementById('selectionModeBtn');
            if(selectionModeActive) {
                btn.classList.replace('bg-slate-700', 'bg-blue-600');
                btn.querySelector('span').innerText = "Modo Seleção Ativo";
            } else {
                btn.classList.replace('bg-blue-600', 'bg-slate-700');
                btn.querySelector('span').innerText = "Selecionar";
                clearSelection();
            }
        });

        // Eventos de Botões
        fileInput.addEventListener('change', handleFiles);
        document.getElementById('clearBtn').addEventListener('click', clearAll);

        // Lógica de Seleção
        function toggleSelection(id, element) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
                element.classList.remove('selected');
            } else {
                selectedIds.add(id);
                element.classList.add('selected');
            }
            updateSelectionBar();
        }

        function updateSelectionBar() {
            if (selectedIds.size > 0) {
                selectionBar.classList.remove('hidden');
                selCountText.innerText = `${selectedIds.size} selecionadas`;
            } else {
                selectionBar.classList.add('hidden');
            }
        }

        function clearSelection() {
            selectedIds.clear();
            document.querySelectorAll('.page-item').forEach(el => el.classList.remove('selected'));
            updateSelectionBar();
        }

        function deleteSelected() {
            selectedIds.forEach(id => {
                const item = document.querySelector(`.page-item[data-id="${id}"]`);
                if (item) grid.removeChild(item);
                delete pagesData[id];
            });
            clearSelection();
            updateEmptyState();
        }

        // Modais de Tela Cheia e Imagem
        function openZoom(id) {
            document.getElementById('zoomImg').src = pagesData[id].rawImageUrl;
            document.getElementById('zoomModal').classList.add('active');
        }
        function closeZoom() { document.getElementById('zoomModal').classList.remove('active'); }
        
        function downloadImage(id) {
            const a = document.createElement('a');
            a.href = pagesData[id].rawImageUrl;
            a.download = `Pagina_${id}.jpg`;
            a.click();
        }

        // Crop Tool Modais e Sliders
        const cropInputs = ['T', 'B', 'L', 'R'];
        cropInputs.forEach(d => {
            document.getElementById(`crop${d}`).addEventListener('input', (e) => {
                document.getElementById(`val${d}`).innerText = e.target.value;
                updateCropVisual();
            });
        });

        function openCrop(id) {
            currentCropId = id;
            document.getElementById('cropPreviewImg').src = pagesData[id].rawImageUrl;
            const c = pagesData[id].crop;
            document.getElementById('cropT').value = c.t; document.getElementById('valT').innerText = c.t;
            document.getElementById('cropB').value = c.b; document.getElementById('valB').innerText = c.b;
            document.getElementById('cropL').value = c.l; document.getElementById('valL').innerText = c.l;
            document.getElementById('cropR').value = c.r; document.getElementById('valR').innerText = c.r;
            updateCropVisual();
            document.getElementById('cropModal').classList.add('active');
        }
        function closeCrop() { document.getElementById('cropModal').classList.remove('active'); currentCropId = null; }
        
        function updateCropVisual() {
            const t = document.getElementById('cropT').value;
            const b = document.getElementById('cropB').value;
            const l = document.getElementById('cropL').value;
            const r = document.getElementById('cropR').value;
            document.getElementById('cropBox').style.clipPath = `inset(${t}% ${r}% ${b}% ${l}%)`;
        }

        function applyCrop() {
            if(!currentCropId) return;
            pagesData[currentCropId].crop = {
                t: parseInt(document.getElementById('cropT').value),
                b: parseInt(document.getElementById('cropB').value),
                l: parseInt(document.getElementById('cropL').value),
                r: parseInt(document.getElementById('cropR').value),
            };
            renderThumbnail(currentCropId);
            closeCrop();
        }

        // Sistema Principal Visual (Renderização)
        function renderThumbnail(id) {
            const data = pagesData[id];
            if (!data) return;
            
            const rot = data.rotation || 0;
            const c = data.crop;
            const isRotated90 = (rot === 90 || rot === 270);

            // Ajusta dimensões pelo crop percentual
            const cropW = data.originalWidth * (1 - (c.l + c.r)/100);
            const cropH = data.originalHeight * (1 - (c.t + c.b)/100);

            let pageW, pageH;
            if (data.type === 'pdf') {
                pageW = cropW; pageH = cropH;
            } else {
                const A4_W = 595.28, A4_H = 841.89;
                const isLandscape = cropW > cropH;
                pageW = isLandscape ? A4_H : A4_W;
                pageH = isLandscape ? A4_W : A4_H;
            }

            const viewW = isRotated90 ? pageH : pageW;
            const viewH = isRotated90 ? pageW : pageH;

            const canvas = document.createElement('canvas');
            const thumbScale = 400 / Math.max(viewW, viewH);
            canvas.width = viewW * thumbScale;
            canvas.height = viewH * thumbScale;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const img = new Image();
            img.onload = () => {
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate((rot * Math.PI) / 180);

                // Aplica o crop fisicamente no desenho do canvas
                const sourceX = data.originalWidth * (c.l/100);
                const sourceY = data.originalHeight * (c.t/100);
                const sourceW = cropW;
                const sourceH = cropH;

                if (data.type === 'pdf') {
                    ctx.drawImage(img, sourceX, sourceY, sourceW, sourceH, -(pageW * thumbScale) / 2, -(pageH * thumbScale) / 2, pageW * thumbScale, pageH * thumbScale);
                } else {
                    const scaleFactor = Math.min(pageW / cropW, pageH / cropH);
                    const drawW = cropW * scaleFactor * thumbScale;
                    const drawH = cropH * scaleFactor * thumbScale;
                    ctx.drawImage(img, sourceX, sourceY, sourceW, sourceH, -drawW / 2, -drawH / 2, drawW, drawH);
                }
                ctx.restore();

                const item = document.querySelector(`.page-item[data-id="${id}"]`);
                if (item) {
                    item.querySelector('.thumb-img').src = canvas.toDataURL('image/jpeg', 0.9);
                    item.querySelector('.canvas-container').style.aspectRatio = `${viewW} / ${viewH}`;
                }
            };
            img.src = data.rawImageUrl; 
        }

        // Leitura de Arquivos
        async function handleFiles(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            showLoading('Lendo arquivos...');
            
            for (const file of files) {
                const arrayBuffer = await file.arrayBuffer();
                const bytes = new Uint8Array(arrayBuffer);
                const currentFileId = `file_${fileIdCounter++}`;

                if (file.type === 'application/pdf') {
                    await processPDF(bytes, currentFileId, file.name);
                } else if (file.type.startsWith('image/')) {
                    await processImage(bytes, file.type, file.name, currentFileId);
                }
            }
            hideLoading();
            updateEmptyState();
            fileInput.value = '';
        }

        async function processPDF(bytes, fileId, fileName) {
            try {
                const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewportReal = page.getViewport({ scale: 1.0 });
                    const viewportThumb = page.getViewport({ scale: 1.5 }); // Escala boa para zoom depois
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewportThumb.width;
                    canvas.height = viewportThumb.height;
                    await page.render({ canvasContext: ctx, viewport: viewportThumb }).promise;

                    createDataAndElement(fileId, 'pdf', bytes, i - 1, viewportReal.width, viewportReal.height, canvas.toDataURL('image/jpeg', 0.9), i === 1 ? fileName : null);
                }
            } catch (error) { alert("Erro ao ler PDF: " + error.message); }
        }

        async function processImage(bytes, mimeType, fileName, fileId) {
            return new Promise((resolve) => {
                const blob = new Blob([bytes], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const imgObj = new Image();
                imgObj.onload = () => {
                    createDataAndElement(fileId, 'image', bytes, 0, imgObj.width, imgObj.height, url, fileName, mimeType);
                    resolve();
                };
                imgObj.src = url;
            });
        }

        function createDataAndElement(fileId, type, bytes, pageIndex, w, h, url, dividerName, mimeType=null) {
            const uniqueId = `item_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            pagesData[uniqueId] = {
                type: type, fileId: fileId, bytes: bytes, mimeType: mimeType,
                pageIndex: pageIndex, rotation: 0, originalWidth: w, originalHeight: h,
                rawImageUrl: url, crop: {t:0, b:0, l:0, r:0}
            };

            const div = document.createElement('div');
            div.className = 'page-item relative group cursor-pointer flex flex-col items-center bg-slate-800 p-2 rounded-xl border border-slate-700 shadow hover:shadow-md h-fit self-start w-full';
            div.dataset.id = uniqueId;
            div.onclick = (e) => { 
                if(selectionModeActive || e.target.closest('.custom-checkbox')) {
                    toggleSelection(uniqueId, div);
                }
            };

            // Divisor Visual (Nome do Arquivo na primeira página)
            let dividerHtml = '';
            if (dividerName) {
                dividerHtml = `<div class="absolute -top-3 left-2 bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-full shadow z-20 whitespace-nowrap overflow-hidden max-w-[90%] text-ellipsis" title="${dividerName}">${dividerName}</div>`;
            }

            const imgContainer = document.createElement('div');
            imgContainer.className = 'canvas-container w-full bg-white rounded-lg overflow-hidden flex items-center justify-center shadow-inner pointer-events-none';
            const img = document.createElement('img');
            img.className = 'thumb-img max-w-full max-h-full object-contain';
            imgContainer.appendChild(img);

            // Ações sobre a miniatura (Zoom, Imagem, Crop, Girar, Lixeira)
            const actions = document.createElement('div');
            actions.className = 'absolute top-2 right-2 flex flex-col gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity z-10';
            
            actions.innerHTML = `
                <button onclick="openZoom('${uniqueId}'); event.stopPropagation();" class="w-8 h-8 bg-slate-900/90 hover:bg-slate-700 text-white rounded-full flex items-center justify-center backdrop-blur shadow" title="Tela Cheia">🔍</button>
                <button onclick="downloadImage('${uniqueId}'); event.stopPropagation();" class="w-8 h-8 bg-slate-900/90 hover:bg-green-600 text-white rounded-full flex items-center justify-center backdrop-blur shadow" title="Baixar JPG">🖼️</button>
                <button onclick="openCrop('${uniqueId}'); event.stopPropagation();" class="w-8 h-8 bg-slate-900/90 hover:bg-orange-600 text-white rounded-full flex items-center justify-center backdrop-blur shadow" title="Recortar">✂️</button>
                <button onclick="pagesData['${uniqueId}'].rotation = (pagesData['${uniqueId}'].rotation + 90) % 360; renderThumbnail('${uniqueId}'); event.stopPropagation();" class="w-8 h-8 bg-slate-900/90 hover:bg-blue-600 text-white rounded-full flex items-center justify-center backdrop-blur shadow" title="Girar">↻</button>
                <button onclick="grid.removeChild(this.closest('.page-item')); delete pagesData['${uniqueId}']; updateEmptyState(); event.stopPropagation();" class="w-8 h-8 bg-slate-900/90 hover:bg-red-600 text-white rounded-full flex items-center justify-center backdrop-blur shadow" title="Excluir">🗑️</button>
            `;

            div.innerHTML = dividerHtml;
            div.appendChild(imgContainer);
            div.appendChild(actions);
            
            // Checkbox visual customizado
            const checkbox = document.createElement('div');
            checkbox.className = 'custom-checkbox absolute bottom-2 left-2 z-10 group-[.selected]:checked';
            checkbox.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
            div.appendChild(checkbox);

            grid.appendChild(div);
            renderThumbnail(uniqueId);
        }

        // Utils
        function showLoading(text) { loadingText.innerText = text; loading.classList.remove('hidden'); loading.classList.add('flex'); }
        function hideLoading() { loading.classList.add('hidden'); loading.classList.remove('flex'); }
        function updateEmptyState() { emptyState.style.opacity = grid.children.length === 0 ? '1' : '0'; }
        function clearAll() { grid.innerHTML = ''; for (let p in pagesData) delete pagesData[p]; selectedIds.clear(); updateSelectionBar(); fileInput.value = ''; updateEmptyState(); }

        // O Coração da Exportação: Gera PDF, Imprime, Compartilha ou Extrai
        async function executeAction(actionType, extractOnly = false) {
            let items = Array.from(document.querySelectorAll('.page-item'));
            if (extractOnly) {
                items = items.filter(item => selectedIds.has(item.dataset.id));
            }
            
            if (items.length === 0) return alert("Nenhuma página disponível para exportação.");
            showLoading('Processando Documento...');

            try {
                const { PDFDocument, degrees, PageSizes } = window.PDFLib;
                const mergedPdf = await PDFDocument.create();
                const pdfCache = {};
                const nUp = parseInt(document.getElementById('nupMode').value);

                const embeddedPagesList = [];

                for (const item of items) {
                    const id = item.dataset.id;
                    const data = pagesData[id];

                    const c = data.crop;
                    
                    if (data.type === 'pdf') {
                        let srcDoc = pdfCache[data.fileId];
                        if (!srcDoc) {
                            srcDoc = await PDFDocument.load(data.bytes, { ignoreEncryption: true });
                            pdfCache[data.fileId] = srcDoc;
                        }
                        const [copiedPage] = await mergedPdf.copyPages(srcDoc, [data.pageIndex]);
                        
                        if(c.t>0 || c.b>0 || c.l>0 || c.r>0) {
                            const w = data.originalWidth; const h = data.originalHeight;
                            copiedPage.setCropBox(w*(c.l/100), h*(c.b/100), w*(1-(c.l+c.r)/100), h*(1-(c.t+c.b)/100));
                        }
                        
                        const baseRot = copiedPage.getRotation().angle || 0;
                        copiedPage.setRotation(degrees(baseRot + data.rotation));
                        
                        if (nUp === 1) {
                            mergedPdf.addPage(copiedPage);
                        } else {
                            const embedded = await mergedPdf.embedPage(copiedPage);
                            embeddedPagesList.push({ el: embedded, type: 'page', rot: 0 }); 
                        }
                    } 
                    else if (data.type === 'image') {
                        let img;
                        if (data.mimeType === 'image/jpeg') img = await mergedPdf.embedJpg(data.bytes);
                        else img = await mergedPdf.embedPng(data.bytes);

                        const cropW = data.originalWidth * (1 - (c.l + c.r)/100);
                        const cropH = data.originalHeight * (1 - (c.t + c.b)/100);
                        const isLandscape = cropW > cropH;
                        const paperDims = isLandscape ? [PageSizes.A4[1], PageSizes.A4[0]] : PageSizes.A4;

                        if (nUp === 1) {
                            const page = mergedPdf.addPage(paperDims);
                            const scaleF = Math.min(paperDims[0] / cropW, paperDims[1] / cropH);
                            const drawW = cropW * scaleF; const drawH = cropH * scaleF;
                            
                            const srcX = data.originalWidth * (c.l/100);
                            const srcY = data.originalHeight * (c.b/100); 

                            page.drawImage(img, {
                                x: paperDims[0] / 2 - drawW / 2, y: paperDims[1] / 2 - drawH / 2,
                                width: drawW, height: drawH
                            });
                            page.setRotation(degrees(data.rotation || 0));
                        } else {
                             embeddedPagesList.push({ el: img, type: 'img', rot: data.rotation });
                        }
                    }
                }

                // Lógica Agrupamento (N-Up: 2 ou 4)
                if (nUp > 1 && embeddedPagesList.length > 0) {
                    const A4 = PageSizes.A4; 
                    const sheetW = nUp === 2 ? A4[1] : A4[0]; 
                    const sheetH = nUp === 2 ? A4[0] : A4[1];

                    for (let i = 0; i < embeddedPagesList.length; i += nUp) {
                        const page = mergedPdf.addPage([sheetW, sheetH]);
                        
                        for (let j = 0; j < nUp; j++) {
                            if (i + j >= embeddedPagesList.length) break;
                            const item = embeddedPagesList[i + j];
                            
                            let cellX, cellY, cellW, cellH;
                            if (nUp === 2) {
                                cellW = sheetW / 2; cellH = sheetH;
                                cellX = j === 0 ? 0 : cellW;
                                cellY = 0;
                            } else { 
                                cellW = sheetW / 2; cellH = sheetH / 2;
                                cellX = (j % 2) === 0 ? 0 : cellW;
                                cellY = j < 2 ? cellH : 0; 
                            }

                            const margin = 10;
                            const drawAreaW = cellW - margin*2;
                            const drawAreaH = cellH - margin*2;

                            const elDims = item.el.scaleToFit(drawAreaW, drawAreaH);
                            
                            if (item.type === 'page') {
                                page.drawPage(item.el, {
                                    x: cellX + margin + (drawAreaW/2 - elDims.width/2),
                                    y: cellY + margin + (drawAreaH/2 - elDims.height/2),
                                    width: elDims.width, height: elDims.height
                                });
                            } else {
                                page.drawImage(item.el, {
                                    x: cellX + margin + (drawAreaW/2 - elDims.width/2),
                                    y: cellY + margin + (drawAreaH/2 - elDims.height/2),
                                    width: elDims.width, height: elDims.height
                                });
                            }
                        }
                    }
                }

                // Geração Final do Arquivo
                const pdfBytes = await mergedPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                let customName = fileNameInput.value.trim();
                if(!customName) customName = "Documento_Workspace";
                const fullFileName = `${customName}.pdf`;

                if (actionType === 'download') {
                    const a = document.createElement('a');
                    a.href = url; a.download = fullFileName;
                    document.body.appendChild(a); a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                } 
                else if (actionType === 'print') {
                    const printFrame = document.getElementById('printFrame');
                    printFrame.src = url;
                    printFrame.onload = function() {
                        printFrame.contentWindow.focus();
                        printFrame.contentWindow.print();
                    };
                }
                else if (actionType === 'share') {
                    if (navigator.share) {
                        const file = new File([blob], fullFileName, { type: 'application/pdf' });
                        try {
                            await navigator.share({ title: fullFileName, files: [file] });
                        } catch (err) { console.log('Compartilhamento falhou', err); }
                    } else {
                        alert("O compartilhamento nativo não é suportado no seu navegador. Use o botão de Baixar.");
                    }
                }

            } catch (error) {
                console.error("Erro na Exportação:", error);
                alert("Erro ao processar: " + error.message);
            }
            hideLoading();
        }
    </script>
